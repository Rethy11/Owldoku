<!--
  Owldoku — happy owl, frame 4 of 4 (win overlay cycle) sprite.

  This is a raster illustration (hand-drawn artwork, rasterized) embedded
  as base64 PNG data inside a small SVG wrapper, cropped and padded to the
  same -4..104 / 108x108 framing convention as the rest of the /sprites
  set, so it drops in and scales exactly like the others. Fully
  self-contained: no external references, nothing else on the page needs
  to change for this file to be swapped for a different image.
-->
<svg viewBox="-4 -4 108 108" xmlns="http://www.w3.org/2000/svg">
  <image x="-4" y="-4" width="108" height="108" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
</svg>
